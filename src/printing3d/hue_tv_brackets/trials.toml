# Parts being tested, not parts that ship. What these produce is built and
# checked like anything else but written outside the committed output, so
# deleting this file retires all of them and changes nothing else.
#
# A part may lean differently from the design; anything it does not say is
# taken from parts.toml.
#
# The twenty entries that were here are gone: the 45-degree radius ladder that
# bound, the 65- and 70-degree ladders that bound at every rung, and the
# 1.0%-strain rungs at 70, 80 and 85 degrees that were never printed because
# standing the corners fully upright removed the strain question entirely.
# Restoring any of them is a git operation -- this file is committed even
# though what it builds is not.

# ---------------------------------------------------------------------------
# The first print with the strip's place fixed. A straight and two corners,
# which is everything needed to check that a corner and a straight now hold the
# strip at the same height and the same distance from their outer edge.
#
# Two inches of straight rather than the full run: the cross-section does not
# vary along it, so a short piece answers the same question for a fifth of the
# filament. The 125 mm length belongs in parts.toml when the set is settled.
# ---------------------------------------------------------------------------

[[straight]]
name = "trial-straight-2in-v1"
length = 50.8
note = "2 in, at the shipped 45-degree lean"

# Upright, where the turn puts none of itself into the strip's own plane. The
# radius is a fitting choice rather than a structural one, so these two bracket
# the range worth handling rather than laddering toward a limit.

[[corner]]
name = "trial-corner-1.5in-v1"
radius = 38.1
tilt = 90.0
note = "1.5 in radius -- the tighter of the two, leaves the most straight run"

[[corner]]
name = "trial-corner-3in-v1"
radius = 76.2
tilt = 90.0
note = "3 in radius -- the gentler sweep, and an easier twist into the straights"

# One piece where there were three. The strip already twists from the 45-degree
# straights into an upright corner when the parts are butted together -- it
# bends that way on its own -- so this carries the twist inside the plastic
# instead of leaving it to the air across a gap.
#
# The lead is the whole straight run either side; the twist is the last part of
# it, measured back from the corner, so the channel is upright before the turn
# starts. Four inches of lead turning over the last three leaves an inch at 45
# degrees to meet a straight section.

[[corner]]
name = "trial-corner-1.5in-90-lead4in-v1"
radius = 38.1
tilt = 90.0
lead = 101.6
twist = 76.2
note = "4 in leads, turning over the last 3 in, into the 1.5 in corner"

# The same corner with the turn packed into a single inch, and no straight
# part at all -- the run starts turning the moment it leaves the open end.
# Printed beside the four-inch one, it answers how short the lead-in can get
# before the twist is more than the strip wants to follow.

[[corner]]
name = "trial-corner-1.5in-90-lead1in-v1"
radius = 38.1
tilt = 90.0
lead = 25.4
twist = 25.4
note = "1 in lead, turning over the whole of it"
