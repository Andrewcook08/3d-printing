# Hue TV brackets -- every measured or chosen number the shape is built from.
#
# Anything derivable from what is here lives in geometry.py instead. If you can
# compute it from these values it does not belong in this file, and writing it
# down anyway will be refused when the file is read.
#
# Parts still being tested live in trials.toml. Deleting that file retires
# every one of them in a single step.

[design]
# The channel, measured off reference/Hue LED Strip with Angle straight
# section.stl.
channel_width = 15.0

# The strip this holds, measured across. The bed must carry it and the mouth
# must neck below it -- that difference is what the clip is.
strip_width = 14.4
channel_depth = 4.0
wall = 1.5
floor_thickness = 2.0

# The clip. Each lip closes this far over the slot while climbing that far,
# necking the 15.0 mm bed down to a 12.0 mm mouth. The strip flexes past it and
# is then held without adhesive of its own, which is the whole point.
lip_reach = 1.5
lip_height = 2.0

# The strip fires out AND back rather than only back: the wall behind this TV
# is dark, and light thrown along a wall washes further than light thrown at it.
# It is also the only lean at which the bracket prints with no support at all.
tilt = 45.0

plate_thickness = 2.0

# How far the plate reaches outboard of the strip's centre, the same at every
# lean, and the edge every bracket is butted to.
#
# Set flush with the channel's outer face when the channel stands upright, so
# an upright corner has no plate standing proud of its lip. A leaning channel
# overhangs the plate instead, which it already does by several millimetres.
pad_outboard = 4.0

# The adhesive footprint, and the tab: the plate's overhang past the arm, which
# is the lever arm resisting the peel that pulled the strip's own adhesive off.
base_depth = 22.0

# ---------------------------------------------------------------------------
# What ships
#
# One corner and four straight lengths. The lengths are a kit rather than a
# ladder: a run is made up from whatever combination covers it, so four sizes
# fit a range of TVs without a size being cut to length or printed to order.
#
# The straights lean at 45 degrees, which is what throws light along the wall
# as well as at it. The corner stands upright, where none of the turn lands in
# the strip's own plane and the radius stops being a question about strain.
# Both hold the strip at the same height and the same distance from the edge
# butted to the marked line -- that is what the lean no longer moving the strip
# bought, and it is why these mix freely.
# ---------------------------------------------------------------------------

[[straight]]
name = "hue-strip-tv-straight-8in-45"
length = 203.2
note = "8 in"

[[straight]]
name = "hue-strip-tv-straight-5in-45"
length = 127.0
note = "5 in"

[[straight]]
name = "hue-strip-tv-straight-3in-45"
length = 76.2
note = "3 in"

[[straight]]
name = "hue-strip-tv-straight-2in-45"
length = 50.8
note = "2 in -- the shortest, for trimming a run to length"

# A corner takes `radius` and `tilt`, and may also be given straight runs
# either side of the turn. Three shapes, and the third is the only one that
# needs more than one extra line:
#
#   lead = 25.4                       the bare turn with plain straight bits
#                                     on it, 1 in each side. The runs hold
#                                     the corner's own `tilt`, whatever it
#                                     is, so this works at any angle.
#
#   lead = 101.6                      runs that leave their open ends at 45
#   run_tilt = 45.0                   degrees to meet the straights, and turn
#   twist = 76.2                      to the corner's lean over the last 3 in
#                                     before it. The twist is measured back
#                                     from the corner, so lengthening `lead`
#                                     moves the straight part, not the turn.
#
#   (neither)                         the bare turn, butted to straights by
#                                     hand.
#
# `run_tilt` and `twist` imply each other: a run given somewhere else to lean
# needs a length to get there, and a run with nowhere else to lean must not
# be given one. Either on its own is refused rather than quietly ignored.

[[corner]]
name = "hue-strip-tv-corner-1.5in-90"
radius = 38.1
tilt = 90.0
note = "1.5 in radius, upright"
