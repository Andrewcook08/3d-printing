# Hue TV brackets -- every measured or chosen number the shape is built from.
#
# Anything derivable from what is here lives in geometry.py instead. If you can
# compute it from these values it does not belong in this file, and writing it
# down anyway will be refused when the file is read.
#
# Parts still being tested live in trials.toml. Deleting that file retires
# every one of them in a single step.

[design]
# The channel, measured off reference/Hue LED Strip with Angle straight
# section.stl.
channel_width = 15.0

# The strip this holds, measured across. The bed must carry it and the mouth
# must neck below it -- that difference is what the clip is.
strip_width = 14.4
channel_depth = 4.0
wall = 1.5
floor_thickness = 2.0

# The clip. Each lip closes this far over the slot while climbing that far,
# necking the 15.0 mm bed down to a 12.0 mm mouth. The strip flexes past it and
# is then held without adhesive of its own, which is the whole point.
lip_reach = 1.5
lip_height = 2.0

# The strip fires out AND back rather than only back: the wall behind this TV
# is dark, and light thrown along a wall washes further than light thrown at it.
# It is also the only lean at which the bracket prints with no support at all.
tilt = 45.0

plate_thickness = 2.0

# The adhesive footprint, and the tab: the plate's overhang past the arm, which
# is the lever arm resisting the peel that pulled the strip's own adhesive off.
base_depth = 22.0

# ---------------------------------------------------------------------------
# What ships
# ---------------------------------------------------------------------------

[[straight]]
name = "straight-125mm-v1"
length = 125.0
note = "the long runs; one covers what five of the original 25 mm clips would"

# The corners stand the channel fully upright. At 90 degrees the strip does no
# in-plane bending at all -- the turn becomes the easy roll it is happy with --
# so the radius stops being a physics question and is only about fit. Below
# 24 mm the tab reaches the turn centre and the shape folds through itself.
#
# The straights lean at 45 and these do not, so the strip twists between them.
# Leave it room to: butt them tight and the twist has nowhere to go.

[[corner]]
name = "corner-tight-v1"
radius = 38.1
tilt = 90.0
note = "1.5 in radius -- hugs the corner, leaves the most straight run"

[[corner]]
name = "corner-wide-v1"
radius = 76.2
tilt = 90.0
note = "3 in radius -- gentler sweep, easier on the strip's twist into the straights"
