name: Upgrade canary

# CI installs exactly what uv.lock pins, so it can never notice a new release of
# anything. This asks the question it cannot: would upgrading change the parts?
# Nothing is committed and nothing merges -- it only reports, so a red canary is
# a decision to make, not a build to fix. See CLAUDE.md for how to read one.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to upgrade, space separated. Empty upgrades all."
        default: ""

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/checks
        with:
          upgrade: "true"
          packages: ${{ inputs.packages }}

      - name: What else is available
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Direct dependencies"
            echo
            echo '```'
            uv tree --outdated --depth 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
