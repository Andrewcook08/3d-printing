name: Pull request checks

# Pull requests only. main takes no direct pushes, so a push trigger would just
# re-run the same checks a second time on every PR branch.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This job's display name IS the status check the branch ruleset requires.
  # Renaming it, or moving these steps into a reusable workflow (which would
  # rename the check to `<job> / <called job>`), blocks every merge until the
  # ruleset is updated to match.
  gates:
    name: lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checks
