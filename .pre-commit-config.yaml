repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # STLs are the point of this repo, so allow them through the size check.
      - id: check-added-large-files
        args: [--maxkb=5000]

  # The golden master lives in the test suite: it is what catches an STL whose
  # bytes changed. Worth paying for on every commit while the suite is fast --
  # and it has to be EVERY commit, not only ones touching Python. Since a
  # project's numbers moved into config, the ordinary way to change a part is
  # to edit a .toml and rebuild, which stages no Python at all.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
